[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-chaos-lorenz"
version = "1.0.0"
description = "Lorenz chaotic attractor simulation with RK4"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "lorenz", "chaos", "simulation", "scientific"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-chaos-lorenz"
Repository = "https://github.com/ElNeMeR70/py-chaos-lorenz"
